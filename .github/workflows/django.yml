name: Django checks

on:
  pull_request:
  push:
    branches:
      - bootstrap
      - codex/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  calendar-browser:
    runs-on: ubuntu-latest
    env:
      CALENDAR_TEST_PASSWORD: ${{ format('calendar-ci-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install "playwright>=1.52,<2"
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py migrate --noinput
      - name: Create an isolated browser-test user
        run: python manage.py shell -c "import os; from django.contrib.auth import get_user_model; from django.contrib.auth.models import Group; from crm.models import CallRecord, Customer; User=get_user_model(); manager=User.objects.create_user(username='calendar-ci', password=os.environ['CALENDAR_TEST_PASSWORD']); manager.groups.add(Group.objects.get(name='CRM Manager')); marketer=User.objects.create_user(username='dashboard-ci-marketer'); marketer.groups.add(Group.objects.get_or_create(name='CRM Marketer')[0]); customer=Customer.objects.create(name='Synthetic dashboard customer', assignee=marketer); CallRecord.objects.create(customer=customer, dialed_number='synthetic-dashboard-number', outcome=CallRecord.Outcome.ANSWERED, external_id='synthetic-dashboard-answered'); CallRecord.objects.create(customer=customer, dialed_number='synthetic-dashboard-number', outcome=CallRecord.Outcome.CALL_AGAIN, external_id='synthetic-dashboard-unanswered')"
      - name: Check CRM pages in Chromium at desktop and mobile widths
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/calendar-runserver.log 2>&1 &
          python scripts/calendar_browser_check.py
